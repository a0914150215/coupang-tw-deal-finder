name: Update Coupang Taiwan deals
on:
  schedule:
    - cron: "0 0 * * *" # 08:00 Taiwan time (UTC+8)
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scraper/**"
      - ".github/workflows/daily-update.yml"

permissions:
  contents: write

concurrency:
  group: coupang-deal-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r scraper/requirements.txt
      - name: Collect public product data
        run: python scraper/coupang_scraper.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Coupang Taiwan deal data"
            git push
          else
            echo "No data changes."
          fi
